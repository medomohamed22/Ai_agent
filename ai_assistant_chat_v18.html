:root{--bg:#fff;--fg:#000;--mut:#6e6e6e;--line:#e5e5e5;--soft:#f5f5f5;--inv:#000;--invfg:#fff;--code:#0b0b0b;--codefg:#ececec;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--good:#16803c;--bad:#b42318;--sh:0 1px 2px rgba(0,0,0,.05),0 10px 34px rgba(0,0,0,.07)}
[data-theme=dark]{--bg:#000;--fg:#fff;--mut:#9a9a9a;--line:#242424;--soft:#101010;--inv:#fff;--invfg:#000;--code:#0f0f0f;--good:#63d387;--bad:#ff8275;--sh:0 1px 2px rgba(0,0,0,.6),0 10px 34px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:400 15.5px/1.8 'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
::selection{background:var(--fg);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}textarea,textarea:focus,textarea:focus-visible{outline:0!important;box-shadow:none}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.i{display:inline-block;width:20px;height:20px;flex:none;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.copyico{display:block;width:19px;height:19px;background:currentColor;--m:var(--ic-copy);-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;transition:transform .3s var(--spring)}
.copyico::before,.copyico::after{content:none!important}
button.done .copyico{--m:var(--ic-check);transform:scale(1.15)}

.i-chev{--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>")}
.logo{display:inline-flex;align-items:flex-end;gap:3px;height:20px;flex:none}.logo b{display:block;width:5px;border-radius:2px;background:currentColor;transform-origin:bottom}.logo b:nth-child(1){height:55%}.logo b:nth-child(2){height:100%}.logo b:nth-child(3){height:75%}
.logo.xl{height:46px;gap:7px;margin-bottom:26px}.logo.xl b{width:11px;border-radius:4px;animation:candle 3.6s ease-in-out infinite}.logo.xl b:nth-child(2){animation-delay:.4s}.logo.xl b:nth-child(3){animation-delay:.8s}
@keyframes candle{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
.app{display:grid;grid-template-columns:276px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;height:100dvh;padding-top:env(safe-area-inset-top)}
aside{border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:14px;gap:10px;background:var(--bg);min-height:0;transition:transform .4s var(--ease)}
.bh{display:flex;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;padding:6px 8px;flex:1}.sx{display:none}
.btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;transition:transform .2s var(--spring),background .2s,border-color .2s,opacity .2s}
.btn:hover{background:var(--soft);border-color:var(--fg)}.btn:active{transform:scale(.97)}.btn.pri{background:var(--inv);color:var(--invfg);border-color:var(--inv);justify-content:center;font-weight:500}.btn.pri:hover{opacity:.85;background:var(--inv)}
.searchbar input{border-radius:14px;padding:9px 14px;font-size:14px;background:var(--soft);border-color:transparent}.searchbar input:focus{background:var(--bg)}
#list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ci{position:relative;display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-radius:12px;cursor:pointer;font-size:14px;color:var(--mut);transition:background .2s,color .2s}
.ci span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci:hover,.ci.on{background:var(--soft);color:var(--fg)}.ci.on{font-weight:500}
.ci::before{content:'';position:absolute;inset-inline-start:3px;top:28%;bottom:28%;width:3px;border-radius:3px;background:var(--fg);transform:scaleY(0);transition:transform .3s var(--spring)}.ci.on::before{transform:none}
.ci i{font-size:0;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;opacity:0;flex:none;transition:opacity .2s,background .2s}.ci i::before{content:'';width:15px;height:15px;background:currentColor;-webkit-mask:var(--ic-x) center/contain no-repeat;mask:var(--ic-x) center/contain no-repeat}
.ci:hover i,.ci.on i{opacity:.55}.ci i:hover{opacity:1;background:var(--line)}
.ci mark{background:transparent;color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:3px}.chat-search-empty{padding:16px 10px;color:var(--mut);font-size:13px;text-align:center}
.bd{display:none}main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
header{flex:none;display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);position:relative;min-height:60px}
.chip{display:inline-flex;align-items:center;gap:9px;padding:6px 12px 6px 14px;border:1px solid var(--line);border-radius:99px;font-size:13.5px;transition:border-color .2s,transform .2s var(--spring);max-width:56vw;position:absolute;left:50%;transform:translateX(-50%);direction:ltr;background:var(--bg)}
.chip:hover{border-color:var(--fg)}.chip:active{transform:translateX(-50%) scale(.96)}.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}.chip .i{width:14px;height:14px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}.dot.ok{background:var(--fg);animation:dotp 2.6s ease-out infinite}@keyframes dotp{0%{box-shadow:0 0 0 0 var(--mut)}70%,100%{box-shadow:0 0 0 7px transparent}}
.sp{flex:1}.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .2s,transform .3s var(--spring),border-color .2s}.ib:hover{background:var(--soft)}.ib:active{transform:scale(.88)}.menu{display:none}
.topnew{border:1px solid var(--line)}.topnew:hover{border-color:var(--fg)}
#theme .i-sun,[data-theme=dark] #theme .i-moon{display:none}[data-theme=dark] #theme .i-sun{display:inline-block}
#chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scroll-behavior:smooth}.wrap{max-width:780px;margin:0 auto;padding:26px 18px 30px}
.m{margin:0 0 26px}.m.new{animation:in .45s var(--ease)}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.m.u{display:flex;flex-direction:column;align-items:flex-start;gap:6px}.m.u .bub{background:var(--inv);color:var(--invfg);padding:10px 18px;border-radius:22px 22px 6px 22px;max-width:88%;white-space:pre-wrap;word-break:break-word}
.fs{display:flex;gap:6px;flex-wrap:wrap;max-width:88%}.fs img{width:96px;height:96px;object-fit:cover;border-radius:16px;border:1px solid var(--line)}
.fc{font-size:12.5px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;color:var(--mut);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
.m.a .bub{word-break:break-word}
.acts{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:30px}.umeta{display:flex;align-items:center;gap:5px;max-width:88%;padding-inline-start:4px}
.acts button,.copyu{width:30px;height:30px;display:grid;place-items:center;padding:0;border-radius:9px;color:var(--mut);font-size:0;transition:background .2s,color .2s,transform .2s var(--spring)}.acts button:hover,.copyu:hover{background:var(--soft);color:var(--fg)}.acts button:active,.copyu:active{transform:scale(.88)}
.acts button[data-act=redo]::before{content:'';width:18px;height:18px;background:currentColor;-webkit-mask:var(--ic-redo) center/contain no-repeat;mask:var(--ic-redo) center/contain no-repeat;transition:transform .5s var(--ease)}.acts button[data-act=redo]:hover::before{transform:rotate(-180deg)}
@media(hover:hover){.m.a .acts,.m.u .umeta{opacity:0;transition:opacity .25s}.m.a:hover .acts,.m.a:last-child .acts,.m.u:hover .umeta,.m.u:last-child .umeta{opacity:1}}
.tooltrace{margin:8px 0 10px;padding:9px 14px;border:1px dashed var(--line);border-radius:14px;font-size:12.5px;color:var(--mut);background:var(--soft)}.tooltrace b{color:var(--fg)}
.live::after{content:'';display:inline-block;width:3px;height:1.1em;border-radius:2px;background:var(--fg);vertical-align:-3px;margin-inline-start:4px;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.agentstatus{display:inline-flex;align-items:center;gap:11px;min-height:34px;padding:5px 0;font-size:14px}
.pulsebar{display:flex;gap:3px;align-items:flex-end;height:18px}.pulsebar i{display:block;width:4px;border-radius:2px;background:var(--fg);transform-origin:bottom;animation:eq .9s ease-in-out infinite}.pulsebar i:nth-child(1){height:9px}.pulsebar i:nth-child(2){height:16px;animation-delay:.14s}.pulsebar i:nth-child(3){height:12px;animation-delay:.28s}
@keyframes eq{0%,100%{transform:scaleY(.5);opacity:.35}50%{transform:scaleY(1);opacity:1}}
.statuslabel{font-weight:500;background:linear-gradient(90deg,var(--mut) 35%,var(--fg) 50%,var(--mut) 65%) 100% 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.8s linear infinite}@keyframes shim{to{background-position:-100% 0}}
.bub h1,.bub h2,.bub h3,.bub h4{margin:20px 0 6px;line-height:1.4;font-weight:600}.bub h1{font-size:1.5em}.bub h2{font-size:1.25em}.bub h3{font-size:1.1em}.bub p{margin:0 0 10px}
.bub ul,.bub ol{margin:0 0 10px;padding-inline-start:24px}.bub li{margin:3px 0}.bub li::marker{color:var(--mut)}.bub a{color:var(--fg);text-underline-offset:3px;text-decoration-thickness:1px}.bub blockquote{border-inline-start:3px solid var(--fg);padding:2px 14px;color:var(--mut);margin:0 0 10px}.bub hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.bub code,.mb code{font:13px 'IBM Plex Mono',ui-monospace,Menlo,monospace;background:var(--soft);padding:1px 7px;border-radius:7px;direction:ltr;unicode-bidi:embed}
.bub pre{direction:ltr;text-align:left;margin:0 0 14px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--code);color:var(--codefg)}.bub pre code{display:block;padding:14px 16px;overflow:auto;background:none;color:inherit;line-height:1.65;white-space:pre}
.ph{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;border-bottom:1px solid #252525;font-size:12px;color:#9a9a9a}.ph button{font-size:12px;color:#bbb;padding:2px 10px;border-radius:99px;border:1px solid #333;transition:all .2s}.ph button:hover{color:#000;background:#fff;border-color:#fff}

.cba button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;border:1px solid #333;color:#c8c8c8;font:500 12px 'IBM Plex Sans Arabic',system-ui,sans-serif;transition:all .2s}
.cba button .i{width:14px;height:14px}.cba button:hover,.cba button.done{color:#000;background:#fff;border-color:#fff}.cba button.done .i{--m:var(--ic-check)}
.cba button[data-cb=preview]{background:#fff;color:#000;border-color:#fff}.cba button[data-cb=preview]:hover{opacity:.82}
.bub .cb pre{margin:0;border:0;border-radius:0;background:none;overflow:visible}
@media(max-width:420px){.cba button[data-cb=copy] span{display:none}.cba button[data-cb=copy]{padding:0 9px}}

/* ===== html preview ===== */
.pvm{width:min(980px,calc(100vw - 24px));height:min(86dvh,820px);max-height:none}
.pvb{flex:1;min-height:0;background:#fff}.pvb iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.ov.pv.full{padding:0}.ov.pv.full .pvm{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0}
@media(max-width:760px){.pvm{height:90dvh}}

/* ===== settings segment ===== */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;background:var(--soft);border-radius:16px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:9px 7px;border-radius:12px;font-size:14px;color:var(--mut);transition:all .3s var(--ease)}.seg button.on{background:var(--inv);color:var(--invfg);font-weight:500}.seg .i{width:16px;height:16px}

/* ===== v14 sources row ===== */
.srcrow{display:flex;align-items:center;gap:10px;margin:10px 0 2px;animation:in .4s var(--ease)}
.srcstack{display:flex;align-items:center;direction:ltr}
.sorb{width:30px;height:30px;border-radius:50%;padding:0;border:2px solid var(--bg);background:var(--soft);display:grid;place-items:center;margin-inline-start:-9px;box-shadow:0 0 0 1px var(--line);overflow:hidden;position:relative;transition:transform .25s var(--spring)}
.srcstack .sorb:first-child{margin-inline-start:0}
.sorb:hover{transform:translateY(-3px) scale(1.08);z-index:3}
.sorb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff;z-index:1}
.sorb .sl{font-size:12px;font-weight:600;line-height:1;color:var(--fg)}
.sorb.more{font-size:11px;font-weight:600;color:var(--fg)}
.srcrow .sourcelabel{margin:0;font-size:12.5px}
.srcrow{flex-wrap:wrap}.sorb{min-width:30px;flex:none;touch-action:manipulation}
@media(max-width:760px){.sorb{width:32px;height:32px}.srcrow{margin-top:12px}}
.i-folder{--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/></svg>")}
.fmrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;cursor:pointer;transition:border-color .2s}.fmrow:hover{border-color:var(--mut)}.fmrow b{flex:1;min-width:0;direction:ltr;text-align:left;font:500 13.5px 'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fmrow small{color:var(--mut)}
.fmbar{display:flex;gap:8px;flex-wrap:wrap}.fmbar .btn{padding:8px 12px;font-size:13.5px}
.fmed{width:100%;min-height:52dvh;direction:ltr;text-align:left;font:13px/1.6 'IBM Plex Mono',monospace;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;white-space:pre;overflow:auto}
/* ===== v16 agent cards + todo + file manager ===== */
@keyframes agIn{from{opacity:0;transform:translateY(10px) scale(.98)}}
@keyframes agPulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.35);opacity:0}}
@keyframes agSweep{from{background-position:-60% 0}to{background-position:160% 0}}
@keyframes agType{0%{transform:scaleX(0)}55%,100%{transform:scaleX(1)}}
@keyframes agSpin{to{transform:rotate(360deg)}}
@keyframes agDraw{to{stroke-dashoffset:0}}
@keyframes agStrike{to{background-size:100% 1.5px}}
@keyframes agGrow{from{width:var(--p0)}}
@keyframes agShim{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes agRow{from{opacity:0;transform:translateX(-14px)}}
@keyframes agShake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@keyframes agGlow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 22%,transparent)}}
@keyframes agPop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.acthost:empty,.todohost:empty{display:none}
.act{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:16px;margin:6px 0;background:var(--bg);position:relative;overflow:hidden;animation:agIn .4s var(--ease)}
.act .ai{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--soft);flex:none;position:relative;transition:background .3s,color .3s}
.act.run .ai::after{content:'';position:absolute;inset:-3px;border-radius:15px;border:2px solid var(--fg);animation:agPulse 1.3s ease-out infinite}
.act.run::after{content:'';position:absolute;inset-inline:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--fg),transparent) no-repeat;background-size:45% 100%;animation:agSweep 1.1s linear infinite}
.act .at{flex:1;min-width:0}.act .at>b{display:block;font-size:13.5px;line-height:1.5}
.act .at code{display:block;direction:ltr;text-align:left;font:12.5px 'IBM Plex Mono',monospace;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .cnt{font-size:12px;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:8px}
.act.run .at>b::after{content:'';display:inline-block;width:1.2em;text-align:start;animation:agDots 1.2s steps(4) infinite}
@keyframes agDots{0%{content:''}25%{content:'.'}50%{content:'..'}75%,100%{content:'...'}}
.act.ok .ai{background:var(--inv);color:var(--invfg)}.act.er .ai{background:var(--bad);color:#fff}.act.er{animation:agIn .4s var(--ease),agShake .45s .3s}.act.wn .ai{background:#b7791f;color:#fff}
.act .ck{width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;animation:agPop .5s .2s var(--spring) both}
.act .ck svg,.todo .tk svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.act .ck path,.todo .ti.d .tk path{stroke-dasharray:24;stroke-dashoffset:24;animation:agDraw .45s .3s forwards}
.klines{display:flex;flex-direction:column;gap:5px;margin-top:9px;direction:ltr}.klines i{display:block;height:5px;border-radius:4px;background:var(--line);width:var(--w);transform-origin:left;animation:agType 1.7s var(--ease) infinite;animation-delay:calc(var(--n)*.2s)}
.dif{direction:ltr;text-align:left;font:12px/1.55 'IBM Plex Mono',monospace;margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.dif div{padding:1px 10px;white-space:pre;overflow:hidden;text-overflow:ellipsis;animation:agRow .4s var(--ease) both;animation-delay:calc(var(--n)*70ms + .15s)}
.dif .m{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad)}.dif .a{background:color-mix(in srgb,var(--good) 13%,transparent);color:var(--good)}
.act .emsg{font-size:12.5px;color:var(--bad);margin-top:4px;line-height:1.55}.act.wn .emsg{color:#b7791f}
.act .pvb{padding:5px 11px;border:1px solid var(--line);border-radius:10px;font-size:12px}.act .pvb:hover{background:var(--soft)}
.act.st,.act.st *{animation:none!important}.act.st .ck path,.todo.st .ti.d .tk path{stroke-dashoffset:0}
.todo{border:1px solid var(--line);border-radius:18px;padding:14px 16px 10px;margin:6px 0 12px;background:var(--soft);animation:agIn .45s var(--ease)}
.todo.all{animation:agIn .45s var(--ease),agGlow 1.4s .5s 2}
.todo .th{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}.todo .th em{margin-inline-start:auto;font-style:normal;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.todo .tb{width:26px;height:26px;border-radius:9px;background:var(--inv);color:var(--invfg);display:grid;place-items:center}.todo .tb .i{width:14px;height:14px}
.todo .tbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:11px 0 8px}
.todo .tbar i{display:block;height:100%;width:var(--p);border-radius:9px;background:linear-gradient(90deg,var(--fg),var(--mut),var(--fg));background-size:200% 100%;animation:agGrow .9s var(--ease),agShim 2.4s linear infinite}
.todo.all .tbar i{background:var(--good);animation:agGrow .9s var(--ease)}
.ti{display:flex;gap:11px;align-items:flex-start;padding:6px 0;font-size:14px;line-height:1.65}
.ti.chg{animation:agRow .5s var(--ease) both;animation-delay:calc(var(--n)*70ms)}
.ti .tk{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut);flex:none;margin-top:2px;display:grid;place-items:center;color:var(--invfg);transition:all .3s}
.ti.i .tk{border-color:var(--fg) transparent var(--fg) var(--fg);animation:agSpin .9s linear infinite}
.ti.i .tx{font-weight:500;background:linear-gradient(90deg,var(--fg) 30%,var(--mut) 50%,var(--fg) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:agShim 2.2s linear infinite}
.ti.d .tk{background:var(--good);border-color:var(--good);color:#fff}.ti.d.chg .tk{animation:agPop .5s .2s var(--spring) both}
.ti.d .tx{color:var(--mut);background:linear-gradient(currentColor,currentColor) no-repeat 100% 55%/100% 1.5px}.ti.d.chg .tx{background-size:0 1.5px;animation:agStrike .6s .3s forwards}
.ti:not(.d) .tk svg{display:none}.todo.st *{animation:none!important}.todo.st .ti.i .tk{animation:agSpin .9s linear infinite!important}

/* ===== v17 smooth plan line + summary sheet ===== */
.tl{position:relative;overflow:hidden;display:flex;align-items:center;gap:11px;width:100%;padding:11px 14px;margin:6px 0 12px;border:1px solid var(--line);border-radius:14px;background:var(--soft);text-align:start;font-size:14px;animation:agIn .4s var(--ease);transition:transform .15s}
.tl:active{transform:scale(.985)}
.tl .tld{width:9px;height:9px;border-radius:50%;background:var(--fg);flex:none;position:relative}
.tl.run .tld::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--fg);animation:agPulse 1.3s ease-out infinite}
.tl.fin .tld{background:var(--good)}
.tl .tlt{flex:1;min-width:0;overflow:hidden}
.tl .tlx{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.7;transition:opacity .22s,transform .22s var(--ease)}
.tl.swp .tlx{opacity:0;transform:translateY(-9px)}
.tl.run .tlx{font-weight:500;background:linear-gradient(90deg,var(--fg) 30%,var(--mut) 50%,var(--fg) 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:agShim 2.2s linear infinite}
.tl.fin .tlx{color:var(--mut)}
.tl em{font-style:normal;font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.tl .tlc{width:7px;height:7px;border-left:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);flex:none;margin-inline-end:2px}
.tls{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0);pointer-events:none;transition:background .3s}
.tls.on{background:rgba(0,0,0,.42);pointer-events:auto}
.tls .tsx{position:absolute;inset-inline:0;bottom:0;max-height:80vh;display:flex;flex-direction:column;background:var(--bg);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .38s var(--ease);padding-bottom:env(safe-area-inset-bottom);max-width:680px;margin:0 auto}
.tls.on .tsx{transform:none}.tls .tsx.drag{transition:none}
.tls .tlh{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0;flex:none}
.tls .tlhd{display:flex;align-items:center;justify-content:space-between;padding:12px 22px 10px;font-weight:700;font-size:18px;flex:none}
.tls .tlhd button{width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;display:grid;place-items:center}
.tls .tlb{overflow:auto;padding:6px 22px 30px;overscroll-behavior:contain}
.tls .tsec{font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 12px}
.tli{display:flex;gap:14px;position:relative;padding-bottom:18px;animation:agIn .35s var(--ease) both;animation-delay:calc(var(--n)*40ms)}
.tli::before{content:'';position:absolute;inset-inline-start:5px;top:20px;bottom:2px;width:2px;background:var(--line)}
.tli.last::before{display:none}
.tli .dt{width:12px;height:12px;border-radius:50%;flex:none;margin-top:7px;background:var(--line);position:relative}
.tli.sd .dt{background:var(--good)}.tli.sr .dt{background:var(--fg)}
.tli.sr .dt::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--fg);animation:agPulse 1.3s ease-out infinite}
.tli.sp .dt{background:var(--bg);border:2px solid var(--mut)}
.tli .tt{flex:1;min-width:0;font-size:15px;line-height:1.75;overflow-wrap:anywhere}
.tli.sd .tt{color:var(--mut)}.tli.big .tt{font-size:19px;font-weight:600;line-height:1.5;color:var(--fg)}
.tli .sub{display:block;direction:ltr;text-align:left;font:12px 'IBM Plex Mono',monospace;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmrow.dir{background:var(--soft)}.fmrow .i{width:18px;height:18px}.fmrow .ib{width:30px;height:30px}.fmrow .ib .i{width:15px;height:15px}
.wsbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.wsbar select{flex:1;min-width:140px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}

/* ===== v18: voice ===== */
:root{--ic-spk:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 9v6h4l5 4V5L8 9z'/><path d='M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11'/></svg>");--ic-spkx:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='6' y='6' width='12' height='12' rx='3' fill='black'/></svg>")}
.i-mic{--m:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect x='9' y='3' width='6' height='11' rx='3'/><path d='M5 11a7 7 0 0 0 14 0M12 18v3'/></svg>")}
#mic{border:1px solid var(--line);position:relative}#mic:hover{background:var(--soft);border-color:var(--fg)}#mic:active{transform:scale(.88)}
#mic.on{background:var(--bad);color:#fff;border-color:var(--bad);animation:mr 1.4s ease-out infinite}@keyframes mr{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.acts button[data-act=speak]::before{content:'';width:18px;height:18px;background:currentColor;-webkit-mask:var(--ic-spk) center/contain no-repeat;mask:var(--ic-spk) center/contain no-repeat}
.acts button[data-act=speak].on{color:var(--fg);background:var(--soft)}.acts button[data-act=speak].on::before{-webkit-mask-image:var(--ic-spkx);mask-image:var(--ic-spkx)}
#vbar{max-width:780px;margin:0 auto 8px;display:flex;align-items:center;gap:10px;padding:5px 14px 5px 6px;border:1px solid var(--line);border-radius:99px;background:var(--soft);font-size:13.5px;animation:in .3s var(--spring)}#vbar[hidden]{display:none}
#vtx{flex:1;color:var(--mut);min-width:0}.vw{display:flex;align-items:center;gap:3px;height:22px;color:var(--bad)}.vw i{width:3px;height:100%;border-radius:3px;background:currentColor;animation:vb 1s ease-in-out infinite}
.vw i:nth-child(2){animation-delay:.15s}.vw i:nth-child(3){animation-delay:.3s}.vw i:nth-child(4){animation-delay:.45s}.vw i:nth-child(5){animation-delay:.6s}@keyframes vb{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
#vbar.lv .vw i{animation:none;transform:scaleY(calc(.2 + var(--lv,0)*var(--k,1)));transition:transform .08s}#vbar.busy .vw i{animation-duration:.55s;color:var(--mut)}
#vlang{padding:3px 12px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-weight:600;background:var(--bg);direction:ltr}
#vx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}#vx:hover{background:var(--bg);color:var(--fg)}
@media(max-width:420px){.rb{width:38px;height:38px}.box{gap:3px}}
</style>
</head>
<body>
<div class="app">
<aside id="sb">
  <div class="bh"><div class="brand"><span class="logo"><b></b><b></b><b></b></span>المساعد الذكي</div><button class="ib sx" id="sx" aria-label="إغلاق"><b class="i i-x"></b></button></div>
  <button class="btn pri" id="nw"><b class="i i-plus"></b>محادثة جديدة</button>
  <button class="btn" id="fmBtn"><b class="i i-folder"></b>إدارة الملفات</button>
  <div class="searchbar"><input type="search" id="chatq" placeholder="بحث في المحادثات…"></div>
  <div id="list"></div>
  <button class="btn" id="st"><b class="i i-sliders"></b>الإعدادات</button>
</aside>
<div class="bd" id="bd"></div>
<main>
<header>
  <div class="hs"><button class="ib menu" id="mn" aria-label="القائمة"><b class="i i-menu"></b></button></div>
  <button class="chip" id="mc" aria-haspopup="listbox" aria-expanded="false"><i class="dot" id="dt"></i><span id="mt">اختر نموذجاً</span><b class="i i-chev"></b></button>
  <div class="he"><button class="modebtn" id="modeBtn" aria-haspopup="menu" aria-expanded="false"><b class="i i-chat" id="modeIc"></b><span id="modeLb">Chat</span><b class="i i-chev"></b></button></div>
</header>
<div id="chat"><div class="wrap" id="msgs"></div></div>
<footer>
  <button class="down" id="down" aria-label="إلى آخر الرسائل"><b class="i i-down"></b></button>
  <div id="vbar" hidden><span class="vw"><i style="--k:.5"></i><i style="--k:.8"></i><i style="--k:1"></i><i style="--k:.8"></i><i style="--k:.5"></i></span><span id="vtx">أستمع…</span><button type="button" id="vlang" aria-label="تبديل اللغة">ع</button><button type="button" id="vx" aria-label="إلغاء"><b class="i i-x"></b></button></div>
  <div id="tray"></div>
  <div class="box">
    <button class="rb" id="go" aria-label="إرسال"><b class="i i-send"></b><b class="i i-stop"></b></button>
    <textarea id="in" rows="1" placeholder="اكتب رسالتك…"></textarea>
    <button class="rb" id="mic" aria-label="إدخال صوتي" title="إدخال صوتي"><b class="i i-mic"></b></button>
    <button class="rb" id="srch" aria-label="تفعيل البحث" title="بحث الويب"><b class="i i-globe"></b></button>
    <button class="rb" id="at" aria-label="إرفاق ملف"><b class="i i-clip"></b></button>
  </div>
  <input type="file" id="fi" multiple hidden accept="image/*,.txt,.md,.json,.csv,.js,.ts,.py,.html,.css,.xml,.yml,.yaml,.log,.sql,text/*">
</footer>
</main>
</div>

<div class="ov" id="ov"><div class="md">
<div class="mh"><span>الإعدادات</span><div class="sp"></div><button class="ib" id="cl" aria-label="إغلاق"><b class="i i-x"></b></button></div>
<div class="mb">
  <div class="tabs">
    <button class="on" data-t="p">المزوّد والنموذج</button>
    <button data-t="s">المهارات والشروط</button>
    <button data-t="o">الأدوات</button><button data-t="a">النسخ الاحتياطي</button>
  </div>
  <div id="tp" class="settings-section active"></div>
  <div id="ts" class="settings-section"></div>
  <div id="to" class="settings-section"></div>
  <div id="ta" class="settings-section"></div>
</div>
</div></div>
<script>
const DEFAULT_RULES=`أنت مساعد ذكي عام ومفيد، تتحدث بوضوح ودقة وأدب.
قواعد أساسية:
1. أجب بنفس لغة المستخدم، والعربية هي الافتراضية إذا كتب بالعربية.

function normSearch(s=''){
  return String(s).toLowerCase()
    .normalize('NFKD')
    .replace(/[\u064B-\u065F\u0670]/g,'')
    .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .replace(/[^\p{L}\p{N}]+/gu,' ')
    .trim();
}
function chatSearchScore(c,q){
  if(!q)return 1;
  const nq=normSearch(q),tokens=nq.split(/\s+/).filter(Boolean);
  const title=normSearch(c.title||'');
  const body=normSearch((c.msgs||[]).map(m=>m.content||'').join(' '));
  let score=0;
  if(title===nq)score+=100;
  if(title.startsWith(nq))score+=60;
  if(title.includes(nq))score+=40;
  if(body.includes(nq))score+=20;
  for(const t of tokens){
    if(title.includes(t))score+=10;
    if(body.includes(t))score+=3;
  }
  return score;
}
function highlightTitle(title,q){
  if(!q)return esc(title);
  const nq=normSearch(q),tokens=nq.split(/\s+/).filter(Boolean);
  let safe=esc(title);
  for(const t of tokens){
    if(t.length<2)continue;
    try{
      const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
      safe=safe.replace(re,'<mark>$1</mark>');
    }catch{}
  }
  return safe;
}

async function jinaSearch({query,max_results}){
  query=(query||'').trim();
  if(!query)throw Error('Search query required');
  const cfg=S.jina||{};
  const ep=(cfg.endpoint||'https://s.jina.ai/').replace(/\/+$/,'')+'/';
  const lim=Math.max(1,Math.min(10,+max_results||+cfg.maxResults||5));
  const headers={'Accept':'application/json','X-Retain-Images':'none','X-Return-Format':'markdown'};
  if(cfg.key)headers['Authorization']='Bearer '+cfg.key;
  const r=await fetch(ep+'?q='+encodeURIComponent(query),{headers});
  if(!r.ok)throw Error('Jina '+r.status+' '+(await r.text()).slice(0,220));
  const ct=r.headers.get('content-type')||'';
  if(ct.includes('application/json')){
    const j=await r.json(),arr=Array.isArray(j)?j:(j.data||j.results||[]);
    return {query,results:arr.slice(0,lim).map((x,i)=>({
      rank:i+1,title:x.title||'',url:x.url||x.link||'',description:x.description||'',
      content:(x.content||x.text||'').slice(0,5000),publishedTime:x.publishedTime||x.published_time||x.date||''
    }))};
  }
  return {query,results:[{rank:1,title:'Jina Search',url:'',description:'',content:(await r.text()).slice(0,12000),publishedTime:''}]};
}

async function deepJinaResearch(userText){
  const plan=await planSearch(userText);
  const qs=[...new Set(plan.queries)].slice(0,3);
  const errs=[];
  const settled=await Promise.all(qs.map(async q=>{
    try{const r=await webSearch({query:q,max_results:Math.min(5,S.jina?.maxResults||4)});return (r.results||[]).map(x=>({...x,query:q}))}
    catch(e){errs.push(e.message);logDiag('jina','search failed',{query:q,error:e.message});return[]}
  }));
  const seen=new Set(),uniq=[];
  for(const x of settled.flat()){const k=(x.url||x.title||'').toLowerCase();if(!k||seen.has(k))continue;seen.add(k);uniq.push(x)}
  const max=S.agent?.sourceDepth==='deep'?8:S.agent?.sourceDepth==='fast'?4:6;
  return{plan,results:uniq.slice(0,max),errors:errs};
}
